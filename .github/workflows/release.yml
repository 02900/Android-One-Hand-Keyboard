name: Release

# Builds the APK signed with the fixed key and publishes it as the latest GitHub release, with the
# update.json the app reads from releases/latest/download (see README → Actualizaciones).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Restore the signing key
      env:
        OHK_KEYSTORE_BASE64: ${{ secrets.OHK_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$OHK_KEYSTORE_BASE64" ]; then
          echo "::error::Missing the OHK_KEYSTORE_BASE64 secret: the APK would not update the installed app."
          exit 1
        fi
        echo "$OHK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        echo "OHK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

    - name: Build the signed APK
      env:
        OHK_KEYSTORE_PASSWORD: ${{ secrets.OHK_KEYSTORE_PASSWORD }}
        OHK_KEY_ALIAS: ${{ secrets.OHK_KEY_ALIAS }}
        OHK_KEY_PASSWORD: ${{ secrets.OHK_KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew --console=plain assembleDebug

    - name: Write update.json
      run: python3 tools/serve_updates.py --no-build --no-serve --dir dist

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        commit=$(git rev-parse --short HEAD)
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="build-$commit"; fi
        notes="Build $commit: $(git log -1 --format=%s)"
        if gh release view "$tag" > /dev/null 2>&1; then
          gh release upload "$tag" dist/* --clobber
        else
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "One Hand Keyboard $tag" \
            --notes "$notes" --latest
        fi

    - name: Remove the signing key
      if: always()
      run: rm -f "$RUNNER_TEMP/release.jks"
