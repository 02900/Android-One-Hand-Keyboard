name: Release

# Builds the three APKs signed with the fixed key and publishes them as the latest GitHub release:
# - debug: updates itself (needs internet); update.json describes it (see docs/UPDATES.md).
# - release: no network permission, updated by installing a newer release by hand.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Restore the signing key
      env:
        OHK_KEYSTORE_BASE64: ${{ secrets.OHK_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$OHK_KEYSTORE_BASE64" ]; then
          echo "::error::Missing the OHK_KEYSTORE_BASE64 secret: the APK would not update the installed app."
          exit 1
        fi
        echo "$OHK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        echo "OHK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

    - name: Build the signed APKs
      env:
        OHK_KEYSTORE_PASSWORD: ${{ secrets.OHK_KEYSTORE_PASSWORD }}
        OHK_KEY_ALIAS: ${{ secrets.OHK_KEY_ALIAS }}
        OHK_KEY_PASSWORD: ${{ secrets.OHK_KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew --console=plain assembleDebug assembleRelease assembleOnline

    - name: Collect the APKs and write update.json
      run: |
        python3 tools/serve_updates.py --no-build --no-serve --dir dist
        cp app/build/outputs/apk/release/app-ime-release.apk "dist/OneHandKeyboard-release-$(git rev-parse --short HEAD).apk"
        cp app/build/outputs/apk/online/app-ime-online.apk "dist/OneHandKeyboard-online-$(git rev-parse --short HEAD).apk"
        ls -l dist

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        commit=$(git rev-parse --short HEAD)
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="build-$commit"; fi
        {
          echo "Build \`$commit\`: $(git log -1 --format=%s)"
          echo
          echo "| APK | Updates | Internet permission |"
          echo "|---|---|---|"
          echo "| \`OneHandKeyboard-debug-$commit.apk\` | Automatic, from GitHub or a PC on the local network | Required |"
          echo "| \`OneHandKeyboard-release-$commit.apk\` | Manual: install a newer release by hand | Not used |"
          echo "| \`OneHandKeyboard-online-$commit.apk\` | Manual, like release | Only for the trending memes tab (Know Your Meme) |"
          echo
          echo "They are separate apps (\`com.onehandkeyboard.debug\`, \`com.onehandkeyboard\` and \`com.onehandkeyboard.online\`) and can be installed side by side."
        } > "$RUNNER_TEMP/notes.md"
        if gh release view "$tag" > /dev/null 2>&1; then
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
        else
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "One Hand Keyboard $tag" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
        fi

    - name: Remove the signing key
      if: always()
      run: rm -f "$RUNNER_TEMP/release.jks"
